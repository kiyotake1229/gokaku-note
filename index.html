<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>合格ノート</title>
<meta name="description" content="資格の合格をめざす学習アプリ。問題演習・用語カード・模擬試験・学習記録。">
<meta name="theme-color" content="#F4F6FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="合格ノート">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
<script>
  // テーマを描画前に反映（ちらつき防止）
  try {
    var s = JSON.parse(localStorage.getItem('gokaku.v1') || '{}');
    var th = s.profile && s.profile.theme;
    if (th === 'light' || th === 'dark') document.documentElement.setAttribute('data-theme', th);
  } catch (e) {}
  // iPhone のホーム画面アプリの上部の帯（起動時のテーマに合わせる）
  var dark = document.documentElement.getAttribute('data-theme') === 'dark' ||
    (!document.documentElement.getAttribute('data-theme') && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  var sb = document.createElement('meta');
  sb.name = 'apple-mobile-web-app-status-bar-style';
  sb.content = dark ? 'black-translucent' : 'default';
  document.head.appendChild(sb);
</script>
</head>
<body>
<div id="app" class="app">
  <main id="view" class="view" aria-live="polite">
    <div class="boot">
      <div class="boot-logo" aria-hidden="true"></div>
      <p>読み込み中…</p>
    </div>
  </main>
  <nav id="tabbar" class="tabbar" aria-label="メインメニュー" hidden></nav>
</div>
<div id="layer"></div>
<noscript><p style="padding:24px">このアプリを使うには JavaScript を有効にしてください。</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
